name: sms_otp
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  wakelock_plus: ^1.4.0
  get_storage: ^2.1.1
  permission_handler: ^12.0.1
  # restart_app: ^1.3.2
  iconly: ^1.0.1
  awesome_notifications: ^0.10.0
  lottie: ^3.3.1
  background_sms: ^0.0.4
  http: ^1.6.0
  get: ^4.7.3
  flutter:
    sdk: flutter





flutter:
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/lottie/
    - assets/image/

  fonts:
    - family: GilroyBold
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
    - family: GilroySemiBold
      fonts:
        - asset: assets/fonts/Gilroy-SemiBold.ttf
    - family: GilroyMedium
      fonts:
        - asset: assets/fonts/Gilroy-Medium.ttf
    - family: GilroyRegular
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
  uses-material-design: true
  generate: true
